name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check env format
        run: |
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) echo "URL format OK" ;;
            "") echo "URL is EMPTY" ;;
            http*) echo "URL starts with http but format is unusual" ;;
            *) echo "URL does NOT start with https://" ;;
          esac
          echo "URL length: ${#VITE_SUPABASE_URL}"
          case "$VITE_SUPABASE_ANON_KEY" in
            eyJ*) echo "KEY format OK" ;;
            "") echo "KEY is EMPTY" ;;
            *) echo "KEY does NOT start with eyJ" ;;
          esac
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
